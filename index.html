<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toio Lab Web - Gemini Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel">
            <div class="logo">
                <h1>toio Lab</h1>
            </div>
            <div class="header-controls">
                <button id="settings-btn" class="icon-btn" title="設定">⚙️</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar (Controls & Status) -->
            <aside class="sidebar glass-panel">
                <section class="control-section">
                    <h2>LLM Connection</h2>
                    <div class="status-indicator">
                        <span id="ollama-status-dot" class="dot disconnected"></span>
                        <span id="ollama-status-text">Gemini: Checking...</span>
                    </div>
                </section>

                <section class="control-section">
                    <h2>toio Connection</h2>
                    <div class="status-indicator">
                        <span id="toio-status-dot" class="dot disconnected"></span>
                        <span id="toio-status-text">Disconnected</span>
                    </div>
                    <div class="cube-info" id="cube-info" style="display: none;">
                        <div class="info-row">
                            <span>Battery</span>
                            <span id="battery-level">--%</span>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button id="connect-toio-btn" class="primary-btn">Connect Cube</button>
                        <button id="disconnect-toio-btn" class="secondary-btn" disabled>Disconnect</button>
                    </div>
                </section>

                <section class="control-section simulation-container">
                    <h2>Simulation</h2>
                    <div id="simulation-mat" class="simulation-mat">
                        <div id="sim-cube" class="sim-cube">toio</div>
                        <div id="ghost-cube" class="sim-cube ghost" style="display: none;">REAL</div>
                    </div>
                </section>
            </aside>

            <!-- Chat Area -->
            <main class="chat-area glass-panel">
                <div class="chat-history" id="chat-history">
                    <div class="message system">
                        <div class="message-content">
                            toio Lab - Gemini 2.5 Flash<br>
                            「前に少し進んで」「青色に光らせて」などの言葉で操作できます。<br>
                            実機を使う場合は左のパネルから接続してください。
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <textarea id="chat-input" placeholder="toioに話しかける... (Enterで送信)" rows="1"></textarea>
                    <button id="send-btn" class="send-btn" disabled>
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                    <button id="cancel-btn" class="stop-btn" style="display: none;" title="キャンセル">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                            <rect x="6" y="6" width="12" height="12"></rect>
                        </svg>
                    </button>
                </div>
            </main>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2>設定</h2>
            <div class="form-group">
                <label for="gemini-api-key">Gemini API Key</label>
                <input type="password" id="gemini-api-key" placeholder="AIza...">
            </div>
            <div class="form-group">
                <label for="gemini-model">Model</label>
                <input type="text" id="gemini-model" value="gemini-2.5-flash">
            </div>
            <div class="form-group">
                <label for="max-iterations" title="自律行動の最大ステップ数。数字が大きいほど複雑なタスクをこなせますが、時間がかかります。">最大ステップ数 (Max Iterations) ℹ️</label>
                <input type="number" id="max-iterations" value="30" min="1" max="50">
            </div>
            <div class="form-group">
                <button id="clear-memory-btn" class="secondary-btn" style="width: 100%;">セッション記憶をクリア</button>
            </div>
            <div class="modal-actions">
                <button id="save-settings-btn" class="primary-btn">保存</button>
                <button id="close-settings-btn" class="secondary-btn">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/spatial-awareness.js"></script>
    <script src="js/session-memory.js"></script>
    <script src="js/toio-ble.js"></script>
    <script src="js/toio-sim.js"></script>
    <script src="js/toio-combined.js"></script>
    <script src="js/environment.js"></script>
    <script src="js/gemini-client.js"></script>
    <script src="js/tools-schema.js"></script>
    <script src="js/tool-executor.js"></script>
    <script src="js/agent-loop.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
