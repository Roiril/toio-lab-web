<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toio Lab Web - Gemini Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel">
            <div class="logo">
                <h1>toio Lab</h1>
            </div>
            <div class="header-controls">
                <button id="settings-btn" class="icon-btn" title="設定">⚙️</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Left: Status / Controls (narrow) -->
            <aside class="sidebar sidebar-status glass-panel">
                <section class="control-section">
                    <h2>LLM</h2>
                    <div class="status-indicator">
                        <span id="llm-status-dot" class="dot disconnected"></span>
                        <span id="llm-status-text">Checking...</span>
                    </div>
                </section>

                <section class="control-section">
                    <h2>toio</h2>
                    <div class="status-indicator">
                        <span id="toio-status-dot" class="dot disconnected"></span>
                        <span id="toio-status-text">Disconnected</span>
                    </div>
                    <div class="cube-info" id="cube-info">
                        <div class="info-row">
                            <span>Battery</span>
                            <span id="battery-level">--%</span>
                        </div>
                    </div>
                    <div class="btn-group btn-group-stacked">
                        <button id="connect-toio-btn" class="secondary-btn">Connect Cube</button>
                        <button id="disconnect-toio-btn" class="secondary-btn" disabled>Disconnect</button>
                    </div>
                    <small class="hint">未接続でもシミュレータで動作確認できます。</small>
                </section>

                <section class="control-section">
                    <h2>Camera</h2>
                    <div class="status-indicator">
                        <span id="camera-status-dot" class="dot disconnected"></span>
                        <span id="camera-status-text">Disconnected</span>
                    </div>
                    <div class="btn-group btn-group-stacked">
                        <button id="camera-connect-btn" class="secondary-btn">Connect</button>
                        <button id="camera-preview-btn" class="secondary-btn" disabled>Preview</button>
                    </div>
                    <select id="camera-device-select" class="camera-device-select" style="display:none; margin-top:8px;"></select>
                </section>
            </aside>

            <!-- Chat Area -->
            <main class="chat-area glass-panel">
                <div class="chat-history" id="chat-history">
                    <div class="message system welcome">
                        <div class="message-content">
                            <div class="welcome-title">toio Lab — 自然言語で動かす</div>
                            <div class="welcome-body">
                                下のチップを押すか、話しかけてください。実機がなくてもシミュレータで動きます。
                            </div>
                            <div class="quick-starts" id="quick-starts">
                                <button class="chip" data-prompt="前にちょっと進んで">前にちょっと進んで</button>
                                <button class="chip" data-prompt="右に動いて">右に動いて</button>
                                <button class="chip" data-prompt="中央に行って">中央に行って</button>
                                <button class="chip" data-prompt="くるっと一回転して">くるっと一回転</button>
                                <button class="chip" data-prompt="赤く光って">赤く光って</button>
                                <button class="chip" data-prompt="きらきら光りながらスピンして">きらきらスピン</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div id="camera-attach-preview" class="camera-attach-preview" style="display:none">
                        <img id="camera-attach-img" alt="Attached image">
                        <button id="camera-attach-clear" class="icon-btn camera-attach-clear-btn" title="添付を削除">✕</button>
                    </div>
                    <div class="chat-input-row">
                    <button id="camera-capture-btn" class="icon-btn camera-capture-btn" title="カメラで撮影してLLMに添付" disabled>📷</button>
                    <textarea id="chat-input" placeholder="toioに話しかける... (Enterで送信)" rows="1"></textarea>
                    <button id="send-btn" class="send-btn" disabled>
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                    <button id="cancel-btn" class="stop-btn" style="display: none;" title="キャンセル">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                            <rect x="6" y="6" width="12" height="12"></rect>
                        </svg>
                    </button>
                    </div>
                </div>
            </main>

            <!-- Right: Visual panels (simulation + camera preview) -->
            <aside class="sidebar sidebar-visual glass-panel">
                <section class="control-section simulation-container">
                    <h2>Simulation</h2>
                    <div id="simulation-mat" class="simulation-mat">
                        <div id="sim-cube" class="sim-cube">toio</div>
                        <div id="ghost-cube" class="sim-cube ghost" style="display: none;">REAL</div>
                    </div>
                    <div class="sim-readout" id="sim-readout">(—, —) · —°</div>
                </section>

                <section class="control-section">
                    <h2>Camera Feed</h2>
                    <div class="camera-preview-box">
                        <img id="camera-preview-img" class="camera-preview-img" alt="Camera feed" style="display:none">
                        <video id="camera-preview-video" class="camera-preview-img" autoplay muted playsinline style="display:none"></video>
                        <div id="camera-placeholder" class="camera-placeholder">No feed</div>
                    </div>
                </section>
            </aside>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2>設定</h2>
            <div class="form-group">
                <label for="llm-provider">LLM Provider</label>
                <select id="llm-provider">
                    <option value="ollama">Local Ollama</option>
                    <option value="gemini">Google AI Studio (Gemini)</option>
                </select>
            </div>
            
            <!-- Gemini Settings -->
            <div id="gemini-settings-group">
                <div class="form-group">
                    <label for="gemini-api-key">Gemini API Key</label>
                    <input type="password" id="gemini-api-key" placeholder="AIza...">
                </div>
                <div class="form-group">
                    <label for="gemini-model">Gemini Model</label>
                    <input type="text" id="gemini-model" value="gemini-2.5-flash">
                </div>
            </div>

            <!-- Ollama Settings -->
            <div id="ollama-settings-group" style="display: none;">
                <div class="form-group">
                    <label for="ollama-base-url">Ollama Base URL</label>
                    <input type="text" id="ollama-base-url" value="http://localhost:11434">
                </div>
                <div class="form-group">
                    <label for="ollama-model">Ollama Model</label>
                    <input type="text" id="ollama-model" value="gemma4:e4b">
                </div>
            </div>


            <div class="form-group">
                <label for="camera-source">Camera Source</label>
                <select id="camera-source">
                    <option value="usb">USB / 内蔵 Web カメラ（デフォルト）</option>
                    <option value="esp32">ESP32S3 Sense (HTTP)</option>
                </select>
            </div>
            <div class="form-group" id="camera-url-group" style="display:none">
                <label for="camera-url-input">Camera URL (ESP32S3)</label>
                <input type="text" id="camera-url-input" placeholder="http://192.168.x.x">
                <small class="hint">シリアルモニターに表示されるIPアドレスを入力</small>
            </div>
            <div class="form-group">
                <label>校正辞書（ユーザー語彙の記憶）</label>
                <div id="calibration-list" class="calibration-list">
                    <div class="calibration-empty">（まだ記憶はありません）</div>
                </div>
            </div>

            <div class="form-group">
                <button id="clear-memory-btn" class="secondary-btn" style="width: 100%;">セッション記憶をクリア</button>
            </div>
            <div class="modal-actions">
                <button id="save-settings-btn" class="primary-btn">保存</button>
                <button id="close-settings-btn" class="secondary-btn">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/spatial-awareness.js"></script>
    <script src="js/session-memory.js"></script>
    <script src="js/toio-ble.js"></script>
    <script src="js/toio-sim.js"></script>
    <script src="js/toio-combined.js"></script>
    <script src="js/environment.js"></script>
    <script src="js/gemini-client.js"></script>
    <script src="js/ollama-client.js"></script>
    <script src="js/tools-schema.js"></script>
    <script src="js/tool-executor.js"></script>
    <script src="js/agent-loop.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
